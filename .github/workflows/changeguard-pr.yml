name: ChangeGuard PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build ChangeGuard
        run: npm run build

      - name: Review Shopify configuration changes
        env:
          CHANGEGUARD_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CHANGEGUARD_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-pr.mjs
